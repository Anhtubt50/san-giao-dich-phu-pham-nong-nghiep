 const s=p.type==='s',sv=SAVED().includes(p.id),g=(p.gallery&&p.gallery.length?p.gallery:[p.image]).slice(0,5),k=CATS[p.ci],qa=QA()[id]||[];

 return`<div class="wrap"><p><a href="#/market${s?'':'/need'}">← Quay lại</a></p><div class="detail"><div>${s?im(p.image||g[0],p.ci,p.name,'product-image mainimg').replace('loading="lazy"','id="mainImg"')+`<div class="thumbs">${g.map((x,i)=>`<button data-act="thumb" data-s="${okSrc(x)?esc(x):''}" aria-label="Ảnh ${i+1}">${im(x,p.ci,p.name,'')}</button>`).join('')}</div>`:`<div class="ph43" style="display:grid;place-items:center;font-size:90px;background:linear-gradient(135deg,${k.c},#fff);border-radius:14px">${k.e}</div>`}</div>
 <div><span class="st">${s?'Cần bán':'Cần mua'} · ${esc(k.n)}</span><h1>${esc(p.name)}</h1><div class="pr">${price(p)}</div>
 <p>${s?'Số lượng':'Cần'}: <b>${num(p.qty)} ${esc(p.unit)}</b><br>Khu vực: <b>${esc(p.ward?p.ward+', ':'')}${esc(p.prov)}</b><br>${posted(p.ts)}${p.note?'<br>'+esc(p.note):''}</p>
 <div class="sbox">${im(p.sellerAvatar,10,p.seller,'av lg')}<div><b>${esc(p.seller)}</b><p class="note">${s?'Người bán':'Người cần mua'} · ${esc(p.prov)}</p></div></div>
 <div class="acts"><button class="btn dark" data-act="call" data-id="${esc(id)}">📞 Gọi</button><a class="btn ghost" href="https://zalo.me/${esc(normPhone(p.phone||''))}" target="_blank" rel="noopener">Zalo</a><button class="btn" data-act="chat" data-id="${esc(id)}">💬 Chat</button><button class="btn ghost" data-act="save" data-id="${esc(id)}" aria-pressed="${sv}">${sv?'♥ Đã lưu':'♡ Lưu tin'}</button></div></div></div>
 <div class="tabs"><button class="on" data-act="tab" data-t="d">Mô tả</button>${s?'<button data-act="tab" data-t="m">Ảnh & Video</button>':''}<button data-act="tab" data-t="q">Hỏi người ${s?'bán':'mua'} (${qa.length})</button></div>
 <div data-pane="d"><p>${esc(p.desc)}</p>${s?`<table class="sp"><tr><td>Loại phụ phẩm</td><td>${esc(k.n)}</td></tr><tr><td>Đặc tính</td><td>${esc(p.spec||'Hỏi người bán')}</td></tr><tr><td>Mục đích sử dụng</td><td>${esc(p.use||'Hỏi người bán')}</td></tr></table>`:''}</div>
 ${s?`<div data-pane="m" hidden><h3>Video</h3>${vidHtml(p)}<h3 style="margin-top:16px">Thư viện ảnh</h3><div class="thumbs">${g.map(x=>`<button data-act="thumb" data-s="${okSrc(x)?esc(x):''}">${im(x,p.ci,p.name,'')}</button>`).join('')}</div></div>`:''}
 <div data-pane="q" hidden>${qa.map(c=>`<div class="box" style="margin-bottom:8px"><b>${esc(c.n)}</b> <small class="note">${ago(c.ts)}</small><p style="margin:4px 0 0">${esc(c.t)}</p></div>`).join('')||'<p class="note">Chưa có câu hỏi nào.</p>'}
  <form class="r2" style="grid-template-columns:1fr auto" data-form="qa" data-id="${esc(id)}"><input name="t" maxlength="200" placeholder="Viết câu hỏi..." aria-label="Câu hỏi"><button class="btn">Gửi</button></form></div>
 <div class="sechd" style="margin-top:34px"><h2>Tin tương tự</h2></div><div class="grid">${rel.map(card).join('')}</div></div>`}

/* ===== ĐĂNG TIN (3 bước) ===== */
const PS={id:null,step:1,imgs:[],video:''};
function vPost(id){const u=sess(),p=id&&POSTS().find(x=>x.id===id&&x.owner===u.id);if(id&&!p)toast('Không tìm thấy tin cần sửa.','err');
 Object.assign(PS,{id:p?p.id:null,step:1,imgs:p?(p.gallery||[]):[],video:''});
 setTimeout(()=>{const f=$('#postForm');if(!f)return;if(p){['type','ci','name','qty','unit','prov','ward','desc','seller','phone'].forEach(k=>{if(f.elements[k])f.elements[k].value=p[k]??''});f.elements.price.value=p.type==='s'?p.price:p.pmin;f.elements.type.value=p.type;imgPrev()}else{f.elements.seller.value=u.name;f.elements.phone.value=u.phone||'';if(u.prov)f.elements.prov.value=u.prov}showStep()},0);
 return`<div class="wrap" style="max-width:720px"><h1 style="margin:24px 0 14px">${p?'Sửa tin đăng':'Đăng tin'}</h1><ol class="steps" id="steps"><li>1. Loại tin</li><li>2. Thông tin</li><li>3. Ảnh & liên hệ</li></ol>
 <form id="postForm" class="form box" data-form="post" novalidate>
 <div data-s="1" class="form">${fld('Bạn muốn',`<select name="type"><option value="s">Đăng bán phụ phẩm</option><option value="d">Đăng tin cần mua</option></select>`)}${fld('Loại phụ phẩm',`<select name="ci">${catOpts('Chọn loại')}</select>`)}${fld('Tiêu đề tin','<input name="name" maxlength="90" placeholder="Ví dụ: Rơm rạ ép kiện số lượng lớn">')}</div>
 <div data-s="2" class="form" hidden><div class="r3">${fld('Số lượng','<input name="qty" type="number" min="0">')}${fld('Đơn vị','<select name="unit"><option>kg</option><option>tấn</option><option>bao</option><option>m³</option></select>')}${fld('Giá (đ/đơn vị)','<input name="price" type="number" min="0">')}</div>
  <div class="r2">${fld('Tỉnh/thành',`<select name="prov">${provOpts('Chọn tỉnh/thành')}</select>`)}${fld('Xã/phường (không bắt buộc)','<input name="ward" maxlength="60">')}</div>${fld('Mô tả','<textarea name="desc" rows="4" maxlength="800" placeholder="Chất lượng, cách đóng gói, thời gian có hàng, cách giao nhận..."></textarea>')}</div>
 <div data-s="3" class="form" hidden><div data-img class="form">${fld('Ảnh (tối đa 5 ảnh, ảnh đầu là ảnh đại diện)','<input name="imgs" type="file" multiple accept="image/*">')}<div class="pv" id="imgPv"></div>
  ${fld('Video (không bắt buộc, chỉ xem trước)','<input name="video" type="file" accept="video/*">')}<div id="vidPv"></div></div>
  <div class="r2">${fld('Tên liên hệ','<input name="seller" maxlength="60">')}${fld('Số điện thoại','<input name="phone" type="tel">')}</div></div>
 <div class="acts" style="margin-top:6px"><button type="button" class="btn ghost" data-act="back" id="bBack">Quay lại</button><button type="button" class="btn" data-act="next" id="bNext">Tiếp tục</button><button class="btn" id="bSave" hidden>${p?'Lưu thay đổi':'Đăng tin'}</button></div></form></div>`}
function showStep(){const f=$('#postForm');if(!f)return;$$('[data-s]',f).forEach(x=>x.hidden=+x.dataset.s!==PS.step);$$('#steps li').forEach((x,i)=>x.classList.toggle('on',i+1===PS.step));
 $('[data-img]',f).hidden=f.elements.type.value==='d';$('#bBack').hidden=PS.step===1;$('#bNext').hidden=PS.step===3;$('#bSave').hidden=PS.step!==3}
function stepErr(f,st){const v=n=>f.elements[n].value.trim(),er={};
 if(st===1){if(v('ci')==='')er.ci='Chọn loại phụ phẩm.';if(v('name').length<5)er.name='Tiêu đề cần từ 5 ký tự.'}
 if(st===2){if(!(+v('qty')>0))er.qty='Nhập số lượng.';if(!(+v('price')>0))er.price='Nhập giá.';if(!v('prov'))er.prov='Chọn tỉnh/thành.';if(v('desc').length<10)er.desc='Mô tả cần từ 10 ký tự.'}
 if(st===3){if(v('seller').length<2)er.seller='Nhập tên liên hệ.';if(!phoneOK(normPhone(v('phone'))))er.phone='Số điện thoại chưa đúng (ví dụ 0912345678).'}return er}
const imgPrev=()=>{const e=$('#imgPv');if(e)e.innerHTML=PS.imgs.filter(okSrc).map(s=>`<img src="${esc(s)}" alt="Ảnh xem trước">`).join('')};

function chatList(){const u=sess(),l=CN().filter(c=>c.owner===u.id).sort((a,b)=>(b.thread[b.thread.length-1]||{ts:0}).ts-(a.thread[a.thread.length-1]||{ts:0}));
 return l.length?l.map(c=>{const m=c.thread[c.thread.length-1];return`<a class="row" href="#/room/${esc(c.id)}" style="text-decoration:none">${im('',10,c.partner,'av lg')}<div><b>${esc(c.partner)}</b><br><small class="note">${esc(c.title)}</small><br><span>${esc(m?m.t.slice(0,70):'')}</span></div><small class="note">${m?ago(m.ts):''}</small></a>`}).join(''):'<div class="empty"><div>💬</div><h3>Chưa có tin nhắn</h3><p class="note">Bấm "Chat" ở một tin đăng để bắt đầu trò chuyện.</p><a class="btn" href="#/market">Xem chợ phụ phẩm</a></div>'}
const vChat=()=>`<div class="wrap" style="max-width:760px"><h1 style="margin:24px 0 14px">Tin nhắn</h1>${chatList()}</div>`;
function vRoom(id){const u=sess(),c=CN().find(x=>x.id===id&&x.owner===u.id);if(!c)return`<div class="wrap"><div class="empty"><h3>Không tìm thấy cuộc trò chuyện</h3><a class="btn" href="#/chat">Về tin nhắn</a></div></div>`;
 return`<div class="wrap" style="max-width:760px"><p><a href="#/chat">← Tin nhắn</a></p><div class="sbox">${im('',10,c.partner,'av lg')}<div style="flex:1"><b>${esc(c.partner)}</b><p class="note">${esc(c.title)}</p></div><a class="btn sm ghost" href="#/p/${esc(c.ref)}">Xem tin</a></div>
 <div class="room" id="roomBox">${c.thread.map(m=>`<div class="msg ${m.w}"><b>${esc(m.n)}</b><p>${esc(m.t)}</p><small>${tm(m.ts)}</small></div>`).join('')}</div>
 <div class="chips">${['Còn hàng không bạn?','Giá có thương lượng không?','Bạn ở đâu?','Mình muốn lấy số lượng lớn'].map(t=>`<button class="chip" data-act="qr" data-id="${esc(c.id)}" data-t="${esc(t)}">${t}</button>`).join('')}</div>
 <form class="r2" style="grid-template-columns:1fr auto" data-form="msg" data-id="${esc(c.id)}"><input name="t" maxlength="300" placeholder="Nhập tin nhắn..." aria-label="Tin nhắn" autocomplete="off"><button class="btn">Gửi</button></form></div>`}
function openChat(id){const it=byId(id);if(!it)return;const u=sess();let c=CN().find(x=>x.owner===u.id&&x.ref===id);
 if(!c){const t=Date.now();c={id:'c'+t,ref:id,title:it.name,partner:it.seller,prov:it.prov,ts:t,owner:u.id,thread:[]};store.set('al3_conn',CN().concat(c))}location.hash='#/room/'+c.id}
function sendMsg(id,t){let pv='';store.set('al3_conn',CN().map(c=>{if(c.id!==id)return c;pv=c.prov||'';return{...c,thread:c.thread.concat({w:'me',n:sess().name,t,ts:Date.now()})}}));rerender();
 setTimeout(()=>{const l=t.toLowerCase(),r=/còn/.test(l)?'Còn nhé bạn, bạn cần khoảng bao nhiêu?':/giá/.test(l)?'Giá có thể thương lượng nếu lấy số lượng nhiều bạn nhé.':/đâu|địa chỉ/.test(l)?'Mình ở '+(pv||'khu vực đã đăng')+', bạn có thể ghé xem hàng.':/lớn|nhiều|tấn/.test(l)?'Số lượng lớn mình ưu tiên giá tốt, bạn cho mình biết thời gian cần nhận nhé.':'Cảm ơn bạn, mình sẽ phản hồi chi tiết sớm.';
  store.set('al3_conn',CN().map(c=>c.id===id?{...c,thread:c.thread.concat({w:'ptn',n:c.partner,t:r,ts:Date.now()})}:c));if((location.hash||'').startsWith('#/room/'+id))rerender()},900)}

 if(AT==='saved')b=sv.length?`<div class="grid">${sv.map(card).join('')}</div>`:'<div class="empty"><div>♡</div><h3>Chưa lưu tin nào</h3><p class="note">Nhấn ♥ trên tin đăng để lưu lại xem sau.</p></div>';
 if(AT==='prof')b=`<form class="form box" data-form="prof" novalidate style="max-width:520px">${fld(u.method==='phone'?'Số điện thoại đăng nhập':'Email đăng nhập',`<input value="${esc(u.key)}" disabled>`)}${fld('Họ và tên',`<input name="name" value="${esc(u.name)}">`)}${u.method!=='phone'?fld('Số điện thoại liên hệ',`<input name="phone" value="${esc(u.phone||'')}">`):''}${fld('Tỉnh/thành',`<select name="prov">${provOpts('Chưa chọn').replace(`<option>${esc(u.prov)}</option>`,`<option selected>${esc(u.prov)}</option>`)}</select>`)}${fld('Ảnh đại diện','<input name="avatar" type="file" accept="image/*">')}<button class="btn">Lưu thông tin</button></form>`;
 return`<div class="wrap"><h1 style="margin:24px 0 14px">Tài khoản</h1><div class="prof">${im(u.avatar,10,u.name,'av lg')}<div style="flex:1"><b>${esc(u.name)}</b><br><span class="note">${esc(u.key)}</span></div><button class="btn sm ghost" data-act="logout">Đăng xuất</button></div>
 <div class="tabs"><a class="${AT==='mine'?'on':''}" href="#/account/mine">Tin của tôi</a><a class="${AT==='saved'?'on':''}" href="#/account/saved">Đã lưu</a><a class="${AT==='prof'?'on':''}" href="#/account/prof">Hồ sơ</a></div>${b}</div>`}

/* ===== ĐIỀU HƯỚNG ===== */
function route(){const[h,a]=(location.hash.slice(2)||'home').split('/'),u=sess();document.body.classList.toggle('gate',!u);
 if(!u&&h!=='login'&&h!=='welcome'){location.hash='#/welcome';return}
 if(u&&(h==='login'||h==='welcome')){location.hash='#/';return}
 const V={welcome:vWelcome,login:()=>vLogin(a),home:vHome,market:()=>vMarket(a),p:()=>vDetail(a),post:()=>vPost(a),chat:vChat,room:()=>vRoom(a),account:()=>vAccount(a),info:()=>vInfo(a)};
 if(!V[h]){location.hash='#/';return}
 $('#app').innerHTML=V[h]();if(h==='market')drawMarket();
 const n=h==='p'||h==='room'?(h==='room'?'chat':'market'):h;$$('[data-n]').forEach(x=>x.classList.toggle('on',x.dataset.n===n));
 const rb=$('#roomBox');if(rb)rb.scrollTop=rb.scrollHeight;scrollTo(0,0)}
function rerender(){const y=scrollY;route();scrollTo(0,y)}

/* ===== SỰ KIỆN ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,u=sess();if(b.tagName==='A'&&!b.getAttribute('target'))e.preventDefault();
 if(a==='cat'){F={...F0,ci:b.dataset.v};location.hash='#/market';if(location.hash==='#/market')route()}
 if(a==='reset'){F={...F0};route()}
 if(a==='more'){shown+=12;drawMarket()}
 if(a==='save'){const had=SAVED().includes(id);store.set('al3_saved',had?SAVED().filter(x=>x!==id):SAVED().concat(id));toast(had?'Đã bỏ lưu tin.':'Đã lưu tin.');rerender()}
 if(a==='thumb'){const m=$('#mainImg');if(m&&b.dataset.s){m.dataset.f='';m.src=b.dataset.s}}
 if(a==='tab'){$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('[data-pane]').forEach(x=>x.hidden=x.dataset.pane!==b.dataset.t)}
 if(a==='call'){const p=byId(id);b.outerHTML=`<a class="btn dark" href="tel:${esc(normPhone(p.phone||''))}">📞 ${esc(p.phone||'Chưa có số')}</a>`}
 if(a==='chat')openChat(id);
 if(a==='qr')sendMsg(id,b.dataset.t);
 if(a==='toggle'){store.set('al3_posts',POSTS().map(p=>p.id===id?{...p,status:p.status==='hidden'?'active':'hidden'}:p));rerender()}
 if(a==='del'&&confirm('Xóa tin đăng này? Không thể hoàn tác.')){store.set('al3_posts',POSTS().filter(p=>p.id!==id));toast('Đã xóa tin.');rerender()}
 if(a==='logout'){store.set('al3_sess',null);location.hash='#/welcome';route();toast('Đã đăng xuất.')}
 if(a==='next'){const f=$('#postForm');if(!showErr(f,stepErr(f,PS.step)))return;PS.step++;showStep();scrollTo(0,0)}
 if(a==='back'){PS.step--;showStep()}});

  let av=u.avatar;const fl=f.elements.avatar.files[0];if(fl){try{av=await readImg(fl)}catch(m){return toast(String(m),'err')}}
  const pr={name:v('name'),phone:ph,prov:v('prov'),avatar:av};store.set('al3_users',arr('al3_users').map(x=>x.id===u.id?{...x,...pr}:x));store.set('al3_sess',{...u,...pr});toast('Đã lưu thông tin.');rerender()}});
